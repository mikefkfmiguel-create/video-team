name = "video-team"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://mikefkfmiguel-create.github.io,https://videoteam.mike-app.com,http://localhost:8787,http://localhost:5500,http://7eventos.avk.pt"
CHAT_URL = "https://things-on.mike-app.com"   # servidor do chat (VPS)

# Segredos (nao ficam aqui): VT_USER, VT_PASSWORD, VT_PIN
# Correr ./set-secrets.ps1 uma vez.

[triggers]
# 4x por dia (UTC): 7h, 12h, 17h, 20h em Lisboa no verao (6h, 11h, 16h, 19h no inverno)
crons = ["0 6,11,16,19 * * *"]

[[kv_namespaces]]
binding = "FOTOS"
id = "aadf3fa50b5d40e1925491038a985831"

# Chat por evento: o servidor esta no VPS (chat-vps/). O Worker so reencaminha o que o dono faz.
# Segredo (nao fica aqui): CHAT_SECRET  ->  wrangler secret put CHAT_SECRET
# A sala em Durable Object (primeira versao do chat) foi retirada: nunca teve dados.
[[migrations]]
tag = "v1-chat"
new_sqlite_classes = ["SalaChat"]

[[migrations]]
tag = "v2-sem-chat-do"
deleted_classes = ["SalaChat"]
