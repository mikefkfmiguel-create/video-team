# Chat por evento do Video Team (servico vt-chat em 127.0.0.1:8782). Incluido no servidor things-on.mike-app.com.
# Sem registo de acessos: os links pessoais vao no endereco do manifesto e do WebSocket.
location = /chat { return 301 /chat/; }

location = /chat/api/ws {
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log off;
}

location /chat/api/admin/ {
    limit_req zone=vtchat_admin burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# fotos do chat: o envio leva ate ~2 MB (a foto ja vem reduzida do telemovel); ver a foto pode ficar em cache privada no aparelho
location = /chat/api/foto {
    limit_req zone=vtchat_api burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    access_log off;
}

location ^~ /chat/api/foto/ {
    limit_req zone=vtchat_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    access_log off;
}

location /chat/api/ {
    limit_req zone=vtchat_api burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    access_log off;
}

location /chat/ {
    proxy_pass http://127.0.0.1:8782;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}
